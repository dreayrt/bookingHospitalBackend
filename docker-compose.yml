services:
  # 1. NestJS Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: booking_backend
    restart: always
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    env_file:
      - .env
    environment:
      - DB_HOST=mariadb
      - REDIS_HOST=redis
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 2. MariaDB Database Service
  mariadb:
    image: mariadb:11
    container_name: booking_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-123456}
      MYSQL_DATABASE: ${DB_NAME:-hospital_management_desktop_system}
      MYSQL_USER: ${DB_USER:-proxyDatabase}
      MYSQL_PASSWORD: ${DB_PASSWORD:-123456}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck-sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: booking_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mariadb_data:
    driver: local
  redis_data:
    driver: local
